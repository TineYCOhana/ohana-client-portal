<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohana | Client Monitoring</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#2c302e;background:#f7f6f2}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{width:238px;background:#253c35;color:#f5f5ed;padding:30px 20px;flex-shrink:0}aside h1{font-family:Georgia,serif;letter-spacing:3px;font-size:27px;margin:0}aside small{color:#c2d2c9;font-size:11px}nav{margin-top:40px}nav button{display:block;width:100%;background:transparent;border:0;color:#dbe6df;text-align:left;padding:13px 14px;border-radius:10px;cursor:pointer;font-size:14px;margin:5px 0}nav button.active,nav button:hover{background:#3d5b50}main{flex:1;min-width:0;padding:35px 40px;max-width:1500px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{font-family:Georgia,serif;font-size:30px;margin:0 0 8px}p.sub{margin:0;color:#78817b;font-size:14px}.btn{background:#365c4b;color:white;border:0;padding:11px 17px;border-radius:9px;cursor:pointer;font-weight:600}.btn.secondary{background:white;color:#355345;border:1px solid #d7dfd9}.btn.danger{background:#a33e3e}.btn.small{padding:7px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:28px 0}.card,.panel{background:white;border:1px solid #e7e9e4;border-radius:15px;padding:21px}.card .label{color:#7b867f;font-size:12px}.card strong{font-size:28px;display:block;margin-top:12px;color:#284b3d}.panel{margin-top:18px;overflow:auto}.panel h3{margin:0 0 17px;font-size:17px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0 0}input,select,textarea{font:inherit;background:white;border:1px solid #d9dfda;border-radius:8px;padding:10px;width:100%;color:#26352d}textarea{resize:vertical;min-height:75px}.toolbar input{max-width:310px}.toolbar select{max-width:225px}table{width:100%;border-collapse:collapse;min-width:850px}th{text-align:left;font-size:12px;color:#78837a;font-weight:600;background:#fafbf8}th,td{padding:13px 11px;border-bottom:1px solid #edf0ea;vertical-align:middle;font-size:13px}td strong{display:block}td small{color:#879189}.pill{display:inline-block;background:#eef3ef;color:#3a624e;border-radius:100px;padding:6px 10px;font-size:11px;font-weight:650}.pill.warn{background:#fff2db;color:#906124}.pill.blue{background:#e9f0fb;color:#3c5e91}.actions{display:flex;gap:6px}.muted{color:#86918a}.empty{text-align:center;padding:35px;color:#7b867e}.modal-backdrop{position:fixed;inset:0;background:#182b23aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(850px,100%);max-height:92vh;overflow:auto;border-radius:17px;padding:26px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{font-family:Georgia,serif;font-size:24px;margin:0}.x{background:transparent;border:0;font-size:25px;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}.field label{display:block;font-size:12px;color:#66736b;margin-bottom:6px;font-weight:600}.field.wide{grid-column:1/-1}.formfooter{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.hint{font-size:12px;color:#7a857e;margin-top:12px}.foot{font-size:12px;color:#8c968e;margin-top:30px}.due{color:#a64d36;font-weight:650}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{background:#fff7e8;color:#775b2b;border-radius:10px;padding:12px;font-size:12px;margin-top:20px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}main{padding:25px}}@media(max-width:650px){.app{display:block}aside{width:100%;padding:17px}nav{margin-top:12px;display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{padding:20px}.cards,.split,.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}.modal{padding:18px}}
</style></head><body><div class="app"><aside><h1>OHANA</h1><small>EVENTS & MANAGEMENT · ADMIN</small><nav><button class="active" data-page="dashboard">◫ &nbsp; Dashboard</button><button data-page="clients">♧ &nbsp; Client Tracker</button><button data-page="payments">₱ &nbsp; Payment Monitoring</button><button data-page="tasks">☑ &nbsp; Follow-ups & Tasks</button></nav></aside><main><div class="top"><div><h2 id="pageTitle">Overview Dashboard</h2><p class="sub" id="pageSub">Your events, clients and booking progress in one place.</p></div><button class="btn" id="addBtn">+ Add Client</button></div><div id="content"></div><p class="foot">Ohana Events & Management by TINE YC · Simple Client Monitoring Portal</p></main></div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Add Client</h3><button class="x" id="closeModal" aria-label="Close">×</button></div><form id="clientForm"><input type="hidden" name="id"><div class="formgrid"><div class="field"><label>Client / Couple Name *</label><input name="name" required maxlength="150"></div><div class="field"><label>Contact Number / Email</label><input name="contact" maxlength="200"></div><div class="field"><label>Event Type</label><select name="type"><option>Wedding</option><option>Birthday</option><option>Debut</option><option>Corporate</option><option>Baptismal</option><option>Other</option></select></div><div class="field"><label>Event Date</label><input type="date" name="date"></div><div class="field"><label>Venue</label><input name="venue" maxlength="200"></div><div class="field"><label>Package / Service</label><input name="package" placeholder="e.g. OTD Coordination" maxlength="150"></div><div class="field"><label>Booking Stage</label><select name="stage" id="stageSelect"></select></div><div class="field"><label>Preparation Status</label><select name="prep"><option>Not Started</option><option>In Progress</option><option>Ready for Event</option><option>Completed</option></select></div><div class="field"><label>Package Amount (₱)</label><input type="number" min="0" step="0.01" name="amount" value="0"></div><div class="field"><label>Total Payments Received (₱)</label><input type="number" min="0" step="0.01" name="paid" value="0"></div><div class="field"><label>Next Follow-up Date</label><input type="date" name="followup"></div><div class="field"><label>Next Action / Requirement</label><input name="action" placeholder="e.g. Send contract" maxlength="200"></div><div class="field wide"><label>Internal Notes / Client Requirements</label><textarea name="notes" placeholder="Meeting notes, supplier updates, checklist items..."></textarea></div></div><div class="formfooter"><button type="button" class="btn secondary" id="cancelModal">Cancel</button><button class="btn" type="submit">Save Client</button></div></form></div></div>
<script>
const KEY='ohana-simple-clients-v1';const STAGES=['Inquiry','Quotation Sent','Quotation Approved','Contract Sent','Contract Signed','Invoice Sent','Payment Pending','Confirmed Booking','Event Completed','Cancelled'];let clients=[];let page='dashboard';const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');clients=Array.isArray(x)?x:[]}catch{clients=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(clients))}function bal(c){return Math.max(0,Number(c.amount||0)-Number(c.paid||0))}function pill(s){return '<span class="pill '+(s.includes('Pending')||s==='Inquiry'?'warn':s.includes('Sent')?'blue':'')+'">'+esc(s)+'</span>'}function row(c){return `<tr><td><strong>${esc(c.name)}</strong><small>${esc(c.type||'')} · ${esc(c.package||'No package')}</small></td><td>${esc(c.date||'Not set')}</td><td>${esc(c.venue||'—')}</td><td>${pill(c.stage||'Inquiry')}</td><td>${money(bal(c))}</td><td><div class="actions"><button class="btn secondary small" data-edit="${esc(c.id)}">Edit</button><button class="btn secondary small" data-delete="${esc(c.id)}">Delete</button></div></td></tr>`}function table(list){return list.length?`<table><thead><tr><th>Client</th><th>Event Date</th><th>Venue</th><th>Booking Stage</th><th>Balance</th><th>Actions</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table>`:'<div class="empty">No client records yet. Click “Add Client” to start.</div>'}function exportCSV(){const cols=['name','contact','type','date','venue','package','stage','prep','amount','paid','followup','action','notes'];const lines=[cols.join(','),...clients.map(c=>cols.map(k=>'"'+String(c[k]??'').replace(/"/g,'""')+'"').join(','))];const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});download(blob,'ohana-clients.csv')}function download(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportJSON(){download(new Blob([JSON.stringify(clients,null,2)],{type:'application/json'}),'ohana-clients-backup.json')}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const titles={dashboard:['Overview Dashboard','Your events, clients and booking progress in one place.'],clients:['Client Monitoring','Track quotations, contracts, booking stages and event details.'],payments:['Payment Monitoring','Monitor total contract amounts, payments received and outstanding balances.'],tasks:['Follow-ups & Tasks','Stay on top of deadlines, requirements and next actions.']};document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('pageSub').textContent=titles[page][1];const active=clients.filter(c=>!['Event Completed','Cancelled'].includes(c.stage));const future=active.filter(c=>c.date&&c.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));let html='';if(page==='dashboard'){html=`<div class="cards"><div class="card"><span class="label">Total Clients</span><strong>${clients.length}</strong></div><div class="card"><span class="label">Active Bookings / Leads</span><strong>${active.length}</strong></div><div class="card"><span class="label">Upcoming Events</span><strong>${future.length}</strong></div><div class="card"><span class="label">Outstanding Balances</span><strong style="font-size:22px">${money(clients.filter(c=>c.stage!=='Cancelled').reduce((s,c)=>s+bal(c),0))}</strong></div></div><div class="panel"><h3>Upcoming Events</h3>${table(future.slice(0,8))}</div><div class="panel"><h3>Pending Follow-ups</h3>${tasksTable(clients.filter(c=>c.followup&&c.stage!=='Event Completed'&&c.stage!=='Cancelled').sort((a,b)=>a.followup.localeCompare(b.followup)).slice(0,8))}</div>`}if(page==='clients'){html=`<div class="toolbar"><input id="search" placeholder="Search client, venue or package..."><select id="filter"><option value="">All booking stages</option>${STAGES.map(s=>`<option>${esc(s)}</option>`).join('')}</select><button class="btn secondary" id="csv">Export CSV</button><button class="btn secondary" id="backup">Backup JSON</button><button class="btn secondary" id="restore">Restore JSON</button><input id="restoreInput" type="file" accept=".json,application/json" hidden></div><div class="panel" id="clientTable">${table(clients)}</div><div class="notice">Records are stored only in this browser. Use Backup JSON regularly. Clearing browser data or switching devices may remove access to records.</div>`}if(page==='payments'){html=`<div class="cards"><div class="card"><span class="label">Total Package Value</span><strong style="font-size:21px">${money(clients.filter(c=>c.stage!=='Cancelled').reduce((s,c)=>s+Number(c.amount||0),0))}</strong></div><div class="card"><span class="label">Total Received</span><strong style="font-size:21px">${money(clients.filter(c=>c.stage!=='Cancelled').reduce((s,c)=>s+Number(c.paid||0),0))}</strong></div><div class="card"><span class="label">Outstanding</span><strong style="font-size:21px">${money(clients.filter(c=>c.stage!=='Cancelled').reduce((s,c)=>s+bal(c),0))}</strong></div><div class="card"><span class="label">Clients with Balance</span><strong>${clients.filter(c=>c.stage!=='Cancelled'&&bal(c)>0).length}</strong></div></div><div class="panel"><h3>Client Payment Overview</h3><table><thead><tr><th>Client</th><th>Package Value</th><th>Paid</th><th>Balance</th><th>Action</th></tr></thead><tbody>${clients.filter(c=>c.stage!=='Cancelled').map(c=>`<tr><td>${esc(c.name)}</td><td>${money(c.amount)}</td><td>${money(c.paid)}</td><td>${money(bal(c))}</td><td><button class="btn secondary small" data-edit="${esc(c.id)}">Update</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No payment records yet.</td></tr>'}</tbody></table></div>`}if(page==='tasks'){html=`<div class="panel"><h3>Client Follow-up List</h3>${tasksTable(clients.filter(c=>c.action||c.followup).sort((a,b)=>(a.followup||'9999').localeCompare(b.followup||'9999')))}</div>`}document.getElementById('content').innerHTML=html;const search=document.getElementById('search'),filter=document.getElementById('filter');function filterRows(){const q=search.value.toLowerCase(),stage=filter.value;document.getElementById('clientTable').innerHTML=table(clients.filter(c=>(!stage||c.stage===stage)&&[c.name,c.venue,c.package,c.contact].some(v=>String(v||'').toLowerCase().includes(q))))}if(search){search.addEventListener('input',filterRows);filter.addEventListener('change',filterRows);document.getElementById('csv').onclick=exportCSV;document.getElementById('backup').onclick=exportJSON;document.getElementById('restore').onclick=()=>document.getElementById('restoreInput').click();document.getElementById('restoreInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(x=>x&&typeof x==='object'&&typeof x.name==='string'))throw Error('Invalid backup');if(confirm('Replace all current records with this backup?')){clients=data;save();render()}}catch(err){alert('Could not restore file: '+err.message)}}}}
function tasksTable(list){return list.length?`<table><thead><tr><th>Client</th><th>Next Action</th><th>Follow-up Date</th><th>Preparation</th><th>Action</th></tr></thead><tbody>${list.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.action||'—')}</td><td class="${c.followup&&c.followup<today()?'due':''}">${esc(c.followup||'Not set')}${c.followup&&c.followup<today()?' · Overdue':''}</td><td>${esc(c.prep||'Not Started')}</td><td><button class="btn secondary small" data-edit="${esc(c.id)}">Edit</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No follow-up tasks yet.</div>'}function openModal(id){const c=clients.find(x=>x.id===id);const f=document.getElementById('clientForm');f.reset();document.getElementById('modalTitle').textContent=c?'Edit Client':'Add Client';for(const el of f.elements){if(el.name)el.value=c?.[el.name]??(el.name==='amount'||el.name==='paid'?'0':el.name==='stage'?'Inquiry':el.name==='prep'?'Not Started':'')}document.getElementById('modal').classList.add('open')}function close(){document.getElementById('modal').classList.remove('open')}document.getElementById('addBtn').onclick=()=>openModal();document.getElementById('closeModal').onclick=close;document.getElementById('cancelModal').onclick=close;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')close()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.getElementById('content').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit)openModal(edit.dataset.edit);if(del&&confirm('Delete this client record permanently?')){clients=clients.filter(c=>c.id!==del.dataset.delete);save();render()}});document.getElementById('clientForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());data.name=data.name.trim();if(!data.name)return;data.amount=Number(data.amount)||0;data.paid=Number(data.paid)||0;if(data.paid>data.amount){alert('Total paid cannot exceed package amount.');return}if(data.id){const i=clients.findIndex(c=>c.id===data.id);if(i>=0)clients[i]=data}else{data.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());clients.push(data)}save();close();render()};document.getElementById('stageSelect').innerHTML=STAGES.map(s=>`<option>${s}</option>`).join('');load();render();
</script></body></html>
